name: Validação estrutural constitucional

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  arquivos-e-modulos:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar catálogo, dependências e links
        run: python scripts/validar_repositorio.py
      - name: Testar pipeline descritivo M05.02 com dados sintéticos
        run: python -m unittest discover -s tests -p 'test_m05_02_auditar_dados.py' -v
