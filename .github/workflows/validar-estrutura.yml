name: Validação estrutural constitucional

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  arquivos-e-modulos:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar catálogo, dependências e links
        run: python scripts/validar_repositorio.py
      - name: Testar pipeline descritivo M05.02 com dados sintéticos
        run: python -m unittest discover -s tests -p 'test_m05_02_auditar_dados.py' -v
      - name: Conferir vista integrada da redação contra fontes CF-NOR
        run: python scripts/gerar_anteprojeto.py --check
      - name: Testar regras de montagem e anti-duplicação literal
        run: python -m unittest discover -s tests -p 'test_redacao_integrada.py' -v
      - name: Conferir fila cooperativa e painel de produto derivado
        run: python scripts/controle_operacional.py --check
      - name: Testar reservas, colisão e bloqueios da fila
        run: python -m unittest discover -s tests -p 'test_controle_operacional.py' -v
      - name: Testar guardas documentais M11 ADCT (nao auditoria juridica)
        run: python -m unittest discover -s tests -p 'test_lote02_m11_garantias_textuais.py' -v
      - name: Testar guardas literais M07 M08 M10 (nao auditoria juridica)
        run: python -m unittest discover -s tests -p 'test_lote01_garantias_textuais.py' -v
      - name: Testar integracao documental dos lotes 01 e 02 (nao parecer juridico)
        run: python -m unittest discover -s tests -p 'test_integracao_lotes_01_02.py' -v
